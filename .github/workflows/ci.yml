name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
      - run: uv sync --locked --extra mcp
      - run: uv run --locked --extra mcp ruff check .
      - run: uv run --locked --extra mcp ruff format --check .
      - run: uv run --locked --extra mcp python scripts/validate_package.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra mcp
      - run: uv run --locked --extra mcp python -m unittest discover -s tests -v
      - run: uv run --locked --extra mcp codemagic-api --help

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
      - run: uv sync --locked --extra mcp
      - run: uv build
      - run: uv run --locked --extra mcp python scripts/build_plugin.py
      - name: Smoke test the installed wheel
        run: uv run --no-project --isolated --with dist/*.whl codemagic-api --version
      - name: Smoke test MCP from the installed wheel
        run: uv run --no-project --isolated --with "$(find dist -name '*.whl')[mcp]" python -c "from codemagic_mcp import create_server; create_server()"
      - name: Launch bundled MCP declarations from the extracted plugin
        run: uv run --locked --extra mcp python scripts/smoke_plugin_mcp.py --plugin dist/codemagic-plugin-*.zip --wheel-dir dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
